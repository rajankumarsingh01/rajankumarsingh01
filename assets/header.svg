<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 300" width="1000" height="300" role="img" aria-label="Rajan Kumar Singh - Full-Stack MERN Developer building production systems with Agentic AI">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#05060f"/>
      <stop offset="0.5" stop-color="#0b0b24"/>
      <stop offset="1" stop-color="#14052a"/>
    </linearGradient>

    <linearGradient id="nameGrad" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="600" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="0.35" stop-color="#818cf8"/>
      <stop offset="0.65" stop-color="#e879f9"/>
      <stop offset="1" stop-color="#22d3ee"/>
      <animateTransform attributeName="gradientTransform" type="translate" from="-600 0" to="600 0" dur="6s" repeatCount="indefinite"/>
    </linearGradient>

    <linearGradient id="lineGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#e879f9" stop-opacity="0"/>
    </linearGradient>

    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#818cf8" stroke-width="0.5" stroke-opacity="0.25"/>
    </pattern>

    <radialGradient id="fade" cx="0.5" cy="0.5" r="0.7">
      <stop offset="0.3" stop-color="#fff" stop-opacity="1"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <mask id="gridMask"><rect width="1000" height="300" fill="url(#fade)"/></mask>

    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="45"/></filter>
    <filter id="glow" x="-20%" y="-50%" width="140%" height="200%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <clipPath id="card"><rect width="1000" height="300" rx="22"/></clipPath>
  </defs>

  <g clip-path="url(#card)">
    <rect width="1000" height="300" fill="url(#bg)"/>

    <!-- floating glow orbs -->
    <circle cx="150" cy="80" r="110" fill="#06b6d4" opacity="0.35" filter="url(#blur)">
      <animateTransform attributeName="transform" type="translate" values="0 0; 120 40; 40 -20; 0 0" dur="14s" repeatCount="indefinite"/>
    </circle>
    <circle cx="820" cy="220" r="130" fill="#a855f7" opacity="0.4" filter="url(#blur)">
      <animateTransform attributeName="transform" type="translate" values="0 0; -140 -50; -40 30; 0 0" dur="17s" repeatCount="indefinite"/>
    </circle>
    <circle cx="560" cy="40" r="90" fill="#ec4899" opacity="0.25" filter="url(#blur)">
      <animateTransform attributeName="transform" type="translate" values="0 0; -90 60; 70 20; 0 0" dur="19s" repeatCount="indefinite"/>
    </circle>

    <!-- grid -->
    <rect width="1000" height="300" fill="url(#grid)" mask="url(#gridMask)">
      <animate attributeName="opacity" values="0.5;1;0.5" dur="5s" repeatCount="indefinite"/>
    </rect>

    <!-- floating particles -->
    <g fill="#c4b5fd">
      <circle cx="90" cy="250" r="2"><animate attributeName="cy" values="260;20" dur="9s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;0" dur="9s" repeatCount="indefinite"/></circle>
      <circle cx="240" cy="270" r="1.6"><animate attributeName="cy" values="280;30" dur="12s" begin="-3s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;0" dur="12s" begin="-3s" repeatCount="indefinite"/></circle>
      <circle cx="430" cy="265" r="2.2"><animate attributeName="cy" values="270;10" dur="10s" begin="-6s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;0" dur="10s" begin="-6s" repeatCount="indefinite"/></circle>
      <circle cx="640" cy="280" r="1.8"><animate attributeName="cy" values="290;20" dur="13s" begin="-2s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;0" dur="13s" begin="-2s" repeatCount="indefinite"/></circle>
      <circle cx="790" cy="260" r="2"><animate attributeName="cy" values="270;15" dur="11s" begin="-8s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;0" dur="11s" begin="-8s" repeatCount="indefinite"/></circle>
      <circle cx="930" cy="275" r="1.5"><animate attributeName="cy" values="285;25" dur="14s" begin="-5s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;0" dur="14s" begin="-5s" repeatCount="indefinite"/></circle>
    </g>

    <!-- bottom waves -->
    <g opacity="0.55">
      <path d="M0 270 Q 100 240 200 270 T 400 270 T 600 270 T 800 270 T 1000 270 T 1200 270 T 1400 270 V300 H0Z" fill="#6366f1" fill-opacity="0.18">
        <animateTransform attributeName="transform" type="translate" from="0 0" to="-400 0" dur="9s" repeatCount="indefinite"/>
      </path>
      <path d="M0 280 Q 100 255 200 280 T 400 280 T 600 280 T 800 280 T 1000 280 T 1200 280 T 1400 280 V300 H0Z" fill="#22d3ee" fill-opacity="0.15">
        <animateTransform attributeName="transform" type="translate" from="-400 0" to="0 0" dur="12s" repeatCount="indefinite"/>
      </path>
    </g>

    <!-- status pill -->
    <g transform="translate(60 38)">
      <rect width="330" height="30" rx="15" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.15"/>
      <circle cx="18" cy="15" r="4.5" fill="#22c55e">
        <animate attributeName="r" values="4;7;4" dur="2s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="1;0.35;1" dur="2s" repeatCount="indefinite"/>
      </circle>
      <circle cx="18" cy="15" r="3.5" fill="#22c55e"/>
      <text x="34" y="20" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="#e2e8f0">Open to Full-Stack / MERN roles</text>
    </g>

    <!-- greeting -->
    <text x="60" y="108" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" fill="#94a3b8" letter-spacing="3">
      &lt;/&gt; HELLO WORLD, I'M
      <animate attributeName="opacity" values="0;1" dur="1.2s" fill="freeze"/>
    </text>

    <!-- name -->
    <text x="60" y="170" font-family="'Segoe UI', Inter, system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="68" font-weight="800" fill="url(#nameGrad)" filter="url(#glow)" letter-spacing="-1">
      Rajan Kumar Singh
      <animate attributeName="opacity" values="0;1" dur="1.4s" fill="freeze"/>
    </text>

    <!-- divider -->
    <rect x="60" y="188" width="560" height="3" rx="1.5" fill="url(#lineGrad)">
      <animate attributeName="width" values="0;560" dur="1.6s" fill="freeze"/>
    </rect>

    <!-- typing roles (12s loop, 4 lines) -->
    <defs>
      <clipPath id="c0"><rect x="60" y="205" height="40" width="0">
        <animate attributeName="width" values="0;333;333;0;0" keyTimes="0;0.1;0.22;0.25;1" dur="12s" repeatCount="indefinite"/></rect></clipPath>
      <clipPath id="c1"><rect x="60" y="205" height="40" width="0">
        <animate attributeName="width" values="0;0;360;360;0;0" keyTimes="0;0.25;0.35;0.47;0.5;1" dur="12s" repeatCount="indefinite"/></rect></clipPath>
      <clipPath id="c2"><rect x="60" y="205" height="40" width="0">
        <animate attributeName="width" values="0;0;400;400;0;0" keyTimes="0;0.5;0.6;0.72;0.75;1" dur="12s" repeatCount="indefinite"/></rect></clipPath>
      <clipPath id="c3"><rect x="60" y="205" height="40" width="0">
        <animate attributeName="width" values="0;0;493;493;0" keyTimes="0;0.75;0.85;0.97;1" dur="12s" repeatCount="indefinite"/></rect></clipPath>
    </defs>

    <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="22" fill="#e2e8f0">
      <g>
        <animate attributeName="opacity" values="1;0" keyTimes="0;0.25" calcMode="discrete" dur="12s" repeatCount="indefinite"/>
        <text x="60" y="232" clip-path="url(#c0)">Full-Stack MERN Developer</text>
        <rect y="211" width="3" height="26" fill="#22d3ee" x="60">
          <animate attributeName="x" values="60;393;393;60;60" keyTimes="0;0.1;0.22;0.25;1" dur="12s" repeatCount="indefinite"/></rect>
      </g>
      <g>
        <animate attributeName="opacity" values="0;1;0" keyTimes="0;0.25;0.5" calcMode="discrete" dur="12s" repeatCount="indefinite"/>
        <text x="60" y="232" clip-path="url(#c1)">Building Agentic AI Systems</text>
        <rect y="211" width="3" height="26" fill="#a78bfa" x="60">
          <animate attributeName="x" values="60;60;420;420;60;60" keyTimes="0;0.25;0.35;0.47;0.5;1" dur="12s" repeatCount="indefinite"/></rect>
      </g>
      <g>
        <animate attributeName="opacity" values="0;1;0" keyTimes="0;0.5;0.75" calcMode="discrete" dur="12s" repeatCount="indefinite"/>
        <text x="60" y="232" clip-path="url(#c2)">RAG • LangGraph • Tool-Calling</text>
        <rect y="211" width="3" height="26" fill="#e879f9" x="60">
          <animate attributeName="x" values="60;60;460;460;60;60" keyTimes="0;0.5;0.6;0.72;0.75;1" dur="12s" repeatCount="indefinite"/></rect>
      </g>
      <g>
        <animate attributeName="opacity" values="0;1" keyTimes="0;0.75" calcMode="discrete" dur="12s" repeatCount="indefinite"/>
        <text x="60" y="232" clip-path="url(#c3)">Production-Ready, Not Tutorial Clones</text>
        <rect y="211" width="3" height="26" fill="#22d3ee" x="60">
          <animate attributeName="x" values="60;60;553;553;60" keyTimes="0;0.75;0.85;0.97;1" dur="12s" repeatCount="indefinite"/></rect>
      </g>
    </g>

    <!-- right side: code card -->
    <g transform="translate(700 70)">
      <animateTransform attributeName="transform" type="translate" values="700 70; 700 58; 700 70" dur="6s" repeatCount="indefinite"/>
      <rect width="250" height="170" rx="14" fill="#0f1126" fill-opacity="0.85" stroke="#818cf8" stroke-opacity="0.4"/>
      <circle cx="18" cy="18" r="5" fill="#ef4444"/><circle cx="36" cy="18" r="5" fill="#f59e0b"/><circle cx="54" cy="18" r="5" fill="#22c55e"/>
      <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13">
        <text x="18" y="58" fill="#c084fc">const<tspan fill="#e2e8f0"> rajan = {</tspan>
          <animate attributeName="opacity" values="0;1" dur="0.5s" begin="0.6s" fill="freeze"/></text>
        <text x="34" y="80" fill="#67e8f9">stack<tspan fill="#e2e8f0">: </tspan><tspan fill="#86efac">"MERN"</tspan><tspan fill="#e2e8f0">,</tspan>
          <animate attributeName="opacity" values="0;1" dur="0.5s" begin="1.2s" fill="freeze"/></text>
        <text x="34" y="102" fill="#67e8f9">ai<tspan fill="#e2e8f0">: </tspan><tspan fill="#86efac">"Agentic"</tspan><tspan fill="#e2e8f0">,</tspan>
          <animate attributeName="opacity" values="0;1" dur="0.5s" begin="1.8s" fill="freeze"/></text>
        <text x="34" y="124" fill="#67e8f9">ships<tspan fill="#e2e8f0">: </tspan><tspan fill="#fbbf24">true</tspan><tspan fill="#e2e8f0">,</tspan>
          <animate attributeName="opacity" values="0;1" dur="0.5s" begin="2.4s" fill="freeze"/></text>
        <text x="18" y="146" fill="#e2e8f0">};
          <animate attributeName="opacity" values="0;1" dur="0.5s" begin="3s" fill="freeze"/></text>
      </g>
    </g>
  </g>
</svg>
