<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 150" width="900" height="150" role="img" aria-label="Hi, I'm Rajan Kumar Singh. Full-Stack MERN Developer building production systems with Agentic AI">
  <defs>
    <linearGradient id="nameGrad" gradientUnits="userSpaceOnUse" x1="120" y1="0" x2="500" y2="0" spreadMethod="reflect">
      <stop offset="0" stop-color="#2f81f7"/>
      <stop offset="0.5" stop-color="#8b5cf6"/>
      <stop offset="1" stop-color="#2f81f7"/>
      <animateTransform attributeName="gradientTransform" type="translate" from="0 0" to="760 0" dur="8s" repeatCount="indefinite"/>
    </linearGradient>

    <clipPath id="clip1"><rect class="l1" x="120" y="18" height="62" width="0"/></clipPath>
    <clipPath id="clip2"><rect class="l2" x="114" y="92" height="40" width="0"/></clipPath>
  </defs>

  <style>
    /* 14s loop: type line 1, type line 2, hold, erase, repeat */
    .l1 { animation: t1 14s steps(25, end) infinite; }
    @keyframes t1 {
      0%   { width: 0; }
      12%  { width: 660px; }
      94%  { width: 660px; }
      100% { width: 0; }
    }
    .l2 { animation: t2 14s steps(70, end) infinite; }
    @keyframes t2 {
      0%, 14% { width: 0; }
      38%     { width: 672px; }
      94%     { width: 672px; }
      100%    { width: 0; }
    }

    /* cursors follow the typing */
    .c1 { animation: m1 14s steps(25, end) infinite; }
    @keyframes m1 {
      0%    { transform: translateX(0);     opacity: 1; }
      12%   { transform: translateX(660px); opacity: 1; }
      12.5% { transform: translateX(660px); opacity: 0; }
      100%  { transform: translateX(660px); opacity: 0; }
    }
    .c2 { animation: m2 14s steps(70, end) infinite; }
    @keyframes m2 {
      0%, 14% { transform: translateX(0);     opacity: 0; }
      14.1%   { transform: translateX(0);     opacity: 1; }
      38%     { transform: translateX(672px); opacity: 1; }
      94%     { transform: translateX(672px); opacity: 1; }
      100%    { transform: translateX(0);     opacity: 1; }
    }

    /* blink */
    .b { animation: blink 1s steps(1, end) infinite; }
    @keyframes blink {
      0%, 49% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }
  </style>

  <!-- line 1: name -->
  <g clip-path="url(#clip1)">
    <text x="120" y="64" textLength="660" lengthAdjust="spacing"
          font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace"
          font-size="44" font-weight="700" fill="url(#nameGrad)">Hi, I'm Rajan Kumar Singh</text>
  </g>
  <g class="c1" style="transform-box: view-box;">
    <rect class="b" x="120" y="26" width="3" height="46" rx="1" fill="#2f81f7"/>
  </g>

  <!-- line 2: tagline -->
  <g clip-path="url(#clip2)">
    <text x="114" y="118" textLength="672" lengthAdjust="spacing"
          font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace"
          font-size="16" fill="#8b949e"><tspan fill="#2f81f7" font-weight="700">Full-Stack MERN Developer</tspan> building production systems with <tspan fill="#8b5cf6" font-weight="700">Agentic AI</tspan></text>
  </g>
  <g class="c2">
    <rect class="b" x="114" y="102" width="2" height="22" rx="1" fill="#8b5cf6"/>
  </g>
</svg>
